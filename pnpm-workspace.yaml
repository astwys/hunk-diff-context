# Only install package versions that have been public for at least 7 days.
minimumReleaseAge: 10080

# Except Hunk itself: the extension targets its newest release on purpose.
minimumReleaseAgeExclude:
  - hunkdiff
  - "hunkdiff-*"

# Hunk's React/OpenTUI peers are only needed by extensions that draw UI.
autoInstallPeers: false
